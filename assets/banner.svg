<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Sen — Industrial Digitalization &amp; MBSE</title>
  <desc id="desc">Banner: Sen, senior software engineer working on industrial digitalization and model-based systems engineering, with Java, Python and React.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="thread" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#818CF8" stop-opacity="0.35"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1F2937" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <rect x="0" y="0" width="6" height="300" fill="url(#accent)"/>

  <text x="64" y="78" fill="#94A3B8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="15" letter-spacing="4">SEN / SENIOR SOFTWARE ENGINEER</text>

  <text x="64" y="150" fill="#F8FAFC" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">Industrial Digitalization</text>
  <text x="64" y="204" fill="#E2E8F0" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="700" letter-spacing="-1">&amp; MBSE</text>

  <text x="64" y="252" fill="#94A3B8" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="18">Java · Python · React · engineering models, production software</text>

  <g fill="none" stroke="url(#thread)" stroke-width="2" stroke-linecap="round">
    <path d="M892 214 L948 154 L1010 190 L1070 108 L1134 146"/>
  </g>
  <g fill="#0B1220" stroke="url(#accent)" stroke-width="2">
    <circle cx="892" cy="214" r="8"/>
    <circle cx="948" cy="154" r="8"/>
    <circle cx="1010" cy="190" r="8"/>
    <circle cx="1070" cy="108" r="8"/>
    <circle cx="1134" cy="146" r="8"/>
  </g>
  <g fill="#64748B" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" font-size="12" letter-spacing="2">
    <text x="872" y="248">REQ</text>
    <text x="928" y="132">ARCH</text>
    <text x="990" y="222">SIM</text>
    <text x="1050" y="86">OPS</text>
    <text x="1114" y="178">DATA</text>
  </g>
</svg>
